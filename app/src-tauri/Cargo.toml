[package]
name = "demogmodrender"
version = "0.1.0"
description = "Garry's Mod demo renderer"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
