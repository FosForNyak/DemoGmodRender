name: CI

on:
  push:
    branches: [beta, release]
  pull_request:
  workflow_dispatch:

# Third-party actions are pinned to commit SHAs (the tag they had when pinned is in the comment).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  engine-windows:
    name: Engine · Windows MSVC
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: vcpkg
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('engine/vcpkg.json', 'engine/vcpkg-configuration.json') }}
      - name: Configure
        working-directory: engine
        run: cmake --preset windows-msvc-debug
      - name: Build
        working-directory: engine
        run: cmake --build --preset windows-msvc-debug
      - name: Test (unit + fuzz smoke; the importer must run in its AppContainer)
        working-directory: engine
        env:
          GMDR_REQUIRE_APPCONTAINER: '1'
        run: ctest --preset windows-msvc-debug

  engine-linux:
    name: Engine · Linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc, linux-clang-asan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang llvm libclang-rt-18-dev
      - name: vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p .vcpkg-cache
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-${{ matrix.preset }}-${{ hashFiles('engine/vcpkg.json', 'engine/vcpkg-configuration.json') }}
      - name: Configure
        working-directory: engine
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        working-directory: engine
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        working-directory: engine
        run: ctest --preset ${{ matrix.preset }}
      - name: Fuzz (60 s per target)
        if: matrix.preset == 'linux-clang-asan'
        working-directory: engine
        run: |
          for f in build/linux-clang-asan/fuzz/fuzz_*; do
            [ -x "$f" ] || continue
            name=$(basename "$f")
            echo "::group::$name"
            "build/linux-clang-asan/fuzz/seeds_${name#fuzz_}" --write-seeds="corpus/$name"
            "$f" -max_total_time=60 -rss_limit_mb=2048 -timeout=10 "corpus/$name"
            echo "::endgroup::"
          done
      - name: Keep fuzz findings
        if: failure() && matrix.preset == 'linux-clang-asan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-findings
          path: |
            engine/crash-*
            engine/timeout-*
            engine/oom-*
          if-no-files-found: ignore

  app-windows:
    name: App · Windows (Tauri)
    runs-on: windows-2025
    needs: engine-windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri
      - name: vcpkg
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force .vcpkg-cache | Out-Null
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .vcpkg-cache
          key: vcpkg-windows-release-${{ hashFiles('engine/vcpkg.json', 'engine/vcpkg-configuration.json') }}
      - name: Install
        working-directory: app
        run: npm ci
      - name: Typecheck and unit tests
        working-directory: app
        run: |
          npm run tokens
          npm run typecheck
          npm test
      - name: Build app and installer (not published)
        working-directory: app
        run: npx tauri build --bundles nsis
      - name: Rust FFI tests
        working-directory: app/src-tauri
        env:
          GMDR_SKIP_ENGINE_BUILD: '1' # built by the step above
        run: cargo test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DemoGmodRender-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
