# =============================================================================
#  Every push and pull request is built and tested:
#   * Windows / Visual Studio: build, unit tests and end-to-end renders through the
#     fake game (tests/fake_game.cpp); the ready .exe files are uploaded as an artifact;
#   * Linux / GCC: build against the system FFmpeg (also covers the old swscale path),
#     tests plain and under ASan + UBSan;
#   * Linux / Clang: 2 minutes of demo parser fuzzing (libFuzzer).
#  A pushed v* tag also publishes a GitHub release with the Windows build, once all
#  jobs have passed. The tag must match the version in CMakeLists.txt.
# =============================================================================
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: FFmpeg (BtbN, shared)
        shell: pwsh
        run: ./scripts/get_ffmpeg.ps1

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGMDR_BUILD_TESTS=ON
          cmake --build build

      - name: whisper-cli (speech recognition)
        shell: pwsh
        run: ./scripts/get_whisper.ps1 -Dest build\whisper

      - name: Synthetic test demos
        shell: pwsh
        run: |
          $env:PATH = "$PWD\third_party\ffmpeg\bin;$env:PATH"
          New-Item -ItemType Directory -Force build\td | Out-Null
          python tests/tools/make_test_demo.py build/td/test24.dem build/td/truth24.json --pe-bits 24
          python tests/tools/make_test_demo.py build/td/test20c.dem build/td/truth20.json --pe-bits 20 --compress-userinfo
          python tests/tools/make_test_demo.py build/td/test2026.dem build/td/truth2026.json --pe-bits 24 --compress-userinfo --gmod2026

      - name: Unit tests
        run: build\gmdr-tests.exe build\td
        env:
          GMDR_TEST_REGISTRY: "1"   # асоціація .dem — в окремому розділі HKCU одноразової машини

      - name: End-to-end renders through the fake game
        shell: pwsh
        run: |
          $fake = "$PWD\build\fake\GarrysMod"
          New-Item -ItemType Directory -Force "$fake\garrysmod\lua\menu", "$fake\garrysmod\cfg" | Out-Null
          Set-Content "$fake\garrysmod\gameinfo.txt" "GameInfo {}"
          Set-Content "$fake\garrysmod\lua\menu\menu.lua" 'include( "util.lua" )'
          Set-Content "$fake\hl2.exe" ""
          # Кадри й звук ідуть з гри іменованими каналами Windows (типово), без файлів кадрів на диску
          foreach ($cap in @("tga", "jpg")) {
            $out = "$PWD\build\out_$cap.mp4"
            $log = & build\gmdr-cli.exe render build\td\test24.dem -o $out --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
                --size 640x360 --fps 30 --codec libx264 --capture $cap --menu-delay 1 --srt 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { $log; throw "рендер ($cap) не вдався" }
            if ($log -notmatch "Каналом прийнято 374 кадрів") { $log; throw "рендер ($cap): кадри не пішли каналом" }
            & third_party\ffmpeg\bin\ffprobe.exe -v error -show_entries stream=codec_name,nb_frames,duration -of compact $out
            if (-not (Test-Path ($out -replace '\.mp4$', '.srt'))) { throw "немає субтитрів" }
          }
          # AVI з FLAC: кодер наприкінці віддає порожній пакет з новим заголовком — муксер не має падати
          $avi = "$PWD\build\out_flac.avi"
          & build\gmdr-cli.exe render build\td\test24.dem -o $avi --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 60 --codec libx264 --acodec flac --menu-delay 1 --start 1 --end 4
          if ($LASTEXITCODE -ne 0) { throw "AVI з FLAC не вдався" }
          # Той самий рендер файлами на диску — кадри й звук мають збігтися з каналом
          $files = "$PWD\build\out_tga_files.mp4"
          & build\gmdr-cli.exe render build\td\test24.dem -o $files --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 30 --codec libx264 --capture tga --menu-delay 1 --frame-transport files
          if ($LASTEXITCODE -ne 0) { throw "рендер файлами не вдався" }
          python tests/tools/compare_av.py "$PWD\build\out_tga.mp4" $files --ffmpeg third_party\ffmpeg\bin
          if ($LASTEXITCODE -ne 0) { throw "рендер каналом відрізняється від рендеру файлами" }
          # Стара назва каналу \\?\pipe\: рушій Source читає "\\" на початку як "//ID шляху/" і пише в
          # garrysmod\pipe\..., якої немає (як справжній GMod). Рендер сам перезапускає гру з файлами,
          # показує рядок консолі гри про невдалий кадр і запам'ятовує це
          Remove-Item "$PWD\build\frame_transport.json" -ErrorAction SilentlyContinue
          $env:GMDR_PIPE_ROOT = "\\?\pipe\"
          $nopipe = "$PWD\build\out_nopipe.mp4"
          $log = & build\gmdr-cli.exe render build\td\test24.dem -o $nopipe --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --start 1 --end 5 2>&1 | Out-String
          $rc = $LASTEXITCODE
          $log2 = & build\gmdr-cli.exe render build\td\test24.dem -o "$PWD\build\out_nopipe2.mp4" --game-dir $fake `
              --game-exe "$PWD\build\gmdr-fakegame.exe" --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --start 1 --end 2 2>&1 | Out-String
          $rc2 = $LASTEXITCODE
          Remove-Item Env:GMDR_PIPE_ROOT
          Remove-Item "$PWD\build\frame_transport.json" -ErrorAction SilentlyContinue
          if ($rc -ne 0 -or $log -notmatch "Couldn't write movie snapshot to file \\\\\?\\pipe" -or $log -notmatch "жодного разу не відкрив канал") {
            $log; throw "перехід з каналу на файли не спрацював (або не видно причини з консолі гри)"
          }
          $d = [double](& third_party\ffmpeg\bin\ffprobe.exe -v error -select_streams v:0 -show_entries stream=duration -of csv=p=0 $nopipe)
          if ([math]::Abs($d - 4) -gt 0.1) { throw "після переходу на файли: очікувалось 4 с відео, а не $d" }
          if ($rc2 -ne 0 -or $log2 -notmatch "канал уже не спрацював") { $log2; throw "невдачу каналу не запам'ятано" }
          & build\gmdr-cli.exe render build\td\test24.dem --test-run --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 30 --codec libx264 --menu-delay 1
          if ($LASTEXITCODE -ne 0) { throw "тестовий прогін не вдався" }
          # Розділи з позначок і субтитри чату (MKV)
          $mkv = "$PWD\build\out_chapters.mkv"
          & build\gmdr-cli.exe render build\td\test24.dem -o $mkv --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --markers "2=Вступ; 4.5=Бій" --chat-srt
          if ($LASTEXITCODE -ne 0) { throw "рендер з позначками не вдався" }
          $chapters = & third_party\ffmpeg\bin\ffprobe.exe -v error -show_chapters -of compact $mkv
          $chapters
          if (@($chapters).Count -ne 3) { throw "очікувалось 3 розділи" }
          if (-not (Select-String -Path ($mkv -replace '\.mkv$', '.srt') -Pattern "Friend: " -Quiet)) { throw "немає чату в субтитрах" }
          # Обробка звуку: вирівнювання, шумодав, приглушення гри, гучність -14 LUFS
          $fx = "$PWD\build\out_fx.mkv"
          & build\gmdr-cli.exe render build\td\test24.dem -o $fx --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --level-voices --denoise --duck-game --loudness -14 --edit-package
          if ($LASTEXITCODE -ne 0) { throw "рендер з обробкою звуку не вдався" }
          # Пакет для монтажу: гра + три голоси окремими WAV і проєкт XML
          $pkg = "$PWD\build\out_fx_монтаж"
          if (@(Get-ChildItem $pkg -Filter *.wav).Count -ne 4) { Get-ChildItem $pkg; throw "пакет для монтажу: очікувалось 4 WAV" }
          [xml]$proj = Get-Content "$pkg\out_fx.xml" -Encoding UTF8
          if (@($proj.xmeml.sequence.media.audio.track).Count -ne 5) { throw "проєкт: очікувалось 5 аудіодоріжок" }
          $r128 = & third_party\ffmpeg\bin\ffmpeg.exe -hide_banner -nostats -i $fx -map 0:a:0 -af ebur128=framelog=quiet -f null - 2>&1 | Out-String
          if ($r128 -notmatch "I:\s+(-?[\d\.]+) LUFS" -or [math]::Abs([double]$matches[1] + 14) -gt 1.5) { $r128; throw "гучність не -14 LUFS" }
          # Додаткові версії з тих самих кадрів: Discord і вертикальна 9:16
          $ver = "$PWD\build\out_ver.mp4"
          $verlog = & build\gmdr-cli.exe render build\td\test24.dem -o $ver --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --also discord,vertical --speaker-overlay 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { $verlog; throw "рендер з версіями не вдався" }
          if ($verlog -notmatch "на кадрі: 3 гравц") { $verlog; throw "немає підписів «хто говорить» на кадрі" }
          $frames = & third_party\ffmpeg\bin\ffprobe.exe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 $ver
          $vert = & third_party\ffmpeg\bin\ffprobe.exe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames -of csv=p=0 ($ver -replace '\.mp4$', '_vertical.mp4')
          $vert
          if ($vert -ne "720,1280,$frames") { throw "вертикальна версія: очікувалось 720,1280,$frames" }
          if (-not (Test-Path ($ver -replace '\.mp4$', '_discord.mp4'))) { throw "немає версії для Discord" }
          # --then shutdown: відлік і дія після рендеру (GMDR_TEST_POWER_DRYRUN — лише запис у журнал)
          $env:GMDR_TEST_POWER_DRYRUN = "1"
          $env:GMDR_TEST_POWER_COUNTDOWN = "1"
          $then = & build\gmdr-cli.exe render build\td\test24.dem -o "$PWD\build\out_then.mp4" --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --start 1 --end 2 --then shutdown 2>&1 | Out-String
          Remove-Item Env:GMDR_TEST_POWER_DRYRUN, Env:GMDR_TEST_POWER_COUNTDOWN
          if ($then -notmatch "зараз було б: вимкнути ПК") { $then; throw "--then shutdown не спрацював" }
          # Уповільнення ×0.5: 2 с демо -> 4 с відео, звук розтягнуто; прискорення ×2 без звуку
          $slow = "$PWD\build\out_slow.mp4"
          & build\gmdr-cli.exe render build\td\test24.dem -o $slow --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --start 1 --end 3 --speed 0.5
          if ($LASTEXITCODE -ne 0) { throw "уповільнений рендер не вдався" }
          $st = & third_party\ffmpeg\bin\ffprobe.exe -v error -show_entries stream=codec_type,duration -of csv=p=0 $slow
          $st
          $vd = [double](($st | Where-Object { $_ -like "video,*" }) -split ",")[1]
          $ad = [double](($st | Where-Object { $_ -like "audio,*" }) -split ",")[1]
          if ([math]::Abs($vd - 4) -gt 0.1 -or [math]::Abs($ad - 4) -gt 0.2) { throw "×0.5: очікувалось 4 с відео і звуку" }
          $fast = "$PWD\build\out_fast.mp4"
          & build\gmdr-cli.exe render build\td\test24.dem -o $fast --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --start 1 --end 5 --speed 2 --speed-audio mute
          if ($LASTEXITCODE -ne 0) { throw "прискорений рендер не вдався" }
          $st = & third_party\ffmpeg\bin\ffprobe.exe -v error -show_entries stream=codec_type,duration -of csv=p=0 $fast
          $st
          if (@($st | Where-Object { $_ -like "audio,*" }).Count -ne 0) { throw "×2 без звуку: є звукова доріжка" }
          if ([math]::Abs([double](($st | Where-Object { $_ -like "video,*" }) -split ",")[1] - 2) -gt 0.1) { throw "×2: очікувалось 2 с відео" }
          # Продовження після збою: гра "падає" на 60-му кадрі і "зависає" на 45-му (сторож — 3 с);
          # програма перезапускає її з того самого місця, і відео виходить цілим
          $env:FAKE_DEMO_CLOCK = "1"
          $env:GMDR_TEST_WATCHDOG = "3"
          foreach ($m in @("CRASH", "HANG")) {
            Remove-Item "$fake\garrysmod\fake_crashed.txt" -ErrorAction SilentlyContinue
            Set-Item "Env:FAKE_$($m)_AT" $(if ($m -eq "CRASH") { "60" } else { "45" })
            $out = "$PWD\build\out_$m.mp4"
            $log = & build\gmdr-cli.exe render build\td\test24.dem -o $out --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
                --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --start 1 --end 7 2>&1 | Out-String
            $rc = $LASTEXITCODE
            Remove-Item "Env:FAKE_$($m)_AT"
            if ($rc -ne 0 -or $log -notmatch "знову записує") { $log; throw "продовження після збою ($m) не спрацювало" }
            $d = [double](& third_party\ffmpeg\bin\ffprobe.exe -v error -select_streams v:0 -show_entries stream=duration -of csv=p=0 $out)
            if ([math]::Abs($d - 6) -gt 0.1) { throw "після збою ($m): очікувалось 6 с відео, а не $d" }
          }
          # Гра 8 с не віддає кадрів, але вантажить процесор (як Remix, що компілює шейдери): сторож (3 с)
          # не вважає її завислою і не перезапускає
          $env:FAKE_BUSY_AT = "40"
          $out = "$PWD\build\out_BUSY.mp4"
          $log = & build\gmdr-cli.exe render build\td\test24.dem -o $out --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --start 1 --end 7 2>&1 | Out-String
          $rc = $LASTEXITCODE
          Remove-Item Env:FAKE_BUSY_AT
          if ($rc -ne 0 -or $log -match "зависла") { $log; throw "зайнята гра: сторож перезапустив її" }
          $d = [double](& third_party\ffmpeg\bin\ffprobe.exe -v error -select_streams v:0 -show_entries stream=duration -of csv=p=0 $out)
          if ([math]::Abs($d - 6) -gt 0.1) { throw "зайнята гра: очікувалось 6 с відео, а не $d" }
          # Паралельний рендер: дві й три копії гри рендерять свої частини одночасно — склеєне відео має
          # збігатися зі звичайним кадр у кадр (спалахи й біпи на тих самих місцях); з додатковою версією
          # і зі збоєм гри в одній із частин
          $env:GMDR_TEST_MIN_PART = "3"
          $base = "$PWD\build\out_single.mp4"
          & build\gmdr-cli.exe render build\td\test24.dem -o $base --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --start 1 --end 11 --no-chapters
          if ($LASTEXITCODE -ne 0) { throw "звичайний рендер для порівняння не вдався" }
          foreach ($n in 2, 3) {
            $out = "$PWD\build\out_par$n.mp4"
            $extra = if ($n -eq 3) { @("--also", "vertical") } else { @() }
            if ($n -eq 2) { Remove-Item "$fake\garrysmod\fake_crashed.txt" -ErrorAction SilentlyContinue; $env:FAKE_CRASH_AT = "40" }
            $log = & build\gmdr-cli.exe render build\td\test24.dem -o $out --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
                --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --start 1 --end 11 --no-chapters --parallel $n @extra 2>&1 | Out-String
            $rc = $LASTEXITCODE
            Remove-Item Env:FAKE_CRASH_AT -ErrorAction SilentlyContinue
            if ($rc -ne 0 -or $log -notmatch "Паралельний рендер: копій гри — $n") { $log; throw "паралельний рендер ($n) не вдався" }
            if ($n -eq 2 -and $log -notmatch "знову записує") { $log; throw "паралельний рендер: копія гри не продовжила після збою" }
            python tests/tools/compare_av.py $base $out --ffmpeg third_party\ffmpeg\bin
            if ($LASTEXITCODE -ne 0) { throw "паралельний рендер ($n) відрізняється від звичайного" }
          }
          $vert = & third_party\ffmpeg\bin\ffprobe.exe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames -of csv=p=0 "$PWD\build\out_par3_vertical.mp4"
          if ($vert -ne "720,1280,300") { throw "паралельний рендер: вертикальна версія $vert" }
          # Дописування рендеру, урваного збоєм програми чи ПК: процес програми вбивається посеред запису,
          # а `resume` дописує решту двома копіями гри — відео має збігатися зі звичайним (стик — на ключовому
          # кадрі, що не завжди припадає на тік, тож спалах може зсунутись на сусідній кадр)
          $res = "$PWD\build\out_resume.mp4"
          $argline = "render `"$PWD\build\td\test24.dem`" -o `"$res`" --game-dir `"$fake`" --game-exe `"$PWD\build\gmdr-fakegame.exe`" " +
                     "--size 640x360 --fps 30 --codec libx264 --menu-delay 1 --start 1 --end 11 --no-chapters --launch-args `"-fakefps 30`""
          $p = Start-Process -FilePath "$PWD\build\gmdr-cli.exe" -ArgumentList $argline -PassThru -WindowStyle Hidden
          $frames = 0
          for ($i = 0; $i -lt 240 -and $frames -lt 150; $i++) {
            Start-Sleep -Milliseconds 500
            $rec = Get-ChildItem "$PWD\build\resume\*.json" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($rec) { $frames = [int]((Get-Content $rec.FullName -Raw | ConvertFrom-Json).frames) }
          }
          Stop-Process -Id $p.Id -Force
          Get-Process gmdr-fakegame -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($frames -lt 150) { throw "дописування: запису про рендер немає ($frames кадрів)" }
          Start-Sleep -Seconds 1
          # Інший рендер до дописування прибирає залишки в теці гри — звук гри урваного має вціліти
          & "$PWD\build\gmdr-cli.exe" render "$PWD\build\td\test24.dem" --test-run --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 30 --codec libx264 --menu-delay 1 2>&1 | Out-Null
          if (-not (Test-Path "$PWD\build\out_resume.gmdr_parts\part0_1.wav")) { throw "дописування: звук гри урваного рендеру не збережено" }
          $log = & "$PWD\build\gmdr-cli.exe" resume --parallel 2 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $log -notmatch "Урваний рендер дописано") { $log; throw "дописування урваного рендеру не вдалося" }
          python tests/tools/compare_av.py $base $res --ffmpeg third_party\ffmpeg\bin --frame-tolerance 1
          if ($LASTEXITCODE -ne 0) { throw "дописаний рендер відрізняється від звичайного" }
          if (Get-ChildItem "$PWD\build\resume\*.json" -ErrorAction SilentlyContinue) { throw "дописування: запис не прибрано" }
          if (Test-Path "$PWD\build\out_resume.gmdr_parts") { throw "дописування: папка частин лишилась" }
          Remove-Item Env:GMDR_TEST_MIN_PART
          Remove-Item Env:FAKE_DEMO_CLOCK, Env:GMDR_TEST_WATCHDOG
          # Розпізнавання мовлення: імітатор whisper-cli ("фраза N" на кожну ділянку звуку і "галюцинація"
          # в тиші) — репліки мають стати на свої місця в часі демо, а галюцинація — відкинутись
          Set-Content "$PWD\build\fake_model.bin" "x"
          $wargs = @("--whisper-cli", "$PWD\build\gmdr-fakewhisper.exe", "--whisper-model", "$PWD\build\fake_model.bin")
          $tr = & build\gmdr-cli.exe transcribe build\td\test24.dem --force @wargs 2>$null | Out-String
          $tr
          foreach ($want in @("[00:02.0] Recorder", "[00:04.0] Friend: фраза 1", "[00:07.5] Friend: фраза 2", "[00:10.0] LateJoiner: фраза 1")) {
            if (-not $tr.Contains($want)) { throw "розпізнавання: немає «$want»" }
          }
          if ($tr -match "Субтитры") { throw "галюцинація Whisper не відфільтрована" }
          $sp = "$PWD\build\out_speech.mp4"
          & build\gmdr-cli.exe render build\td\test24.dem -o $sp --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --start 1 --speech-srt @wargs
          if ($LASTEXITCODE -ne 0) { throw "рендер із текстом розмов не вдався" }
          if (-not (Select-String -Path ($sp -replace '\.mp4$', '.srt') -Pattern "Friend: фраза" -Quiet)) { throw "у субтитрах немає тексту розмов" }
          # Переклад і озвучення (імітатори сервісів): перекладені субтитри, доріжки з мітками мови в
          # основному відео, окреме відео й окремий аудіофайл для кожної мови
          $dub = "$PWD\build\out_dub.mp4"
          & build\gmdr-cli.exe render build\td\test24.dem -o $dub --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" `
              --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --start 1 @wargs `
              --translate de,en --dub --dub-to tracks,videos,audio --dub-format flac --translator fake --tts fake
          if ($LASTEXITCODE -ne 0) { throw "рендер з озвученням не вдався" }
          if (-not (Select-String -Path ($dub -replace '\.mp4$', '.de.srt') -Pattern "\[de\] фраза" -Quiet)) { throw "немає перекладених субтитрів" }
          $tracks = & third_party\ffmpeg\bin\ffprobe.exe -v error -select_streams a -show_entries stream_tags=language -of csv=p=0 $dub | Out-String
          if (-not ($tracks.Contains("deu") -and $tracks.Contains("eng"))) { throw "у відео немає доріжок озвучення з мітками мови: $tracks" }
          foreach ($f in @(($dub -replace '\.mp4$', '_de.mp4'), ($dub -replace '\.mp4$', '.en.flac'))) {
            if (-not (Test-Path $f)) { throw "немає $f" }
          }
          if (Test-Path ($dub -replace '\.mp4$', '.dub_tmp')) { throw "тимчасова тека озвучення не прибрана" }
          # Черга: три фрагменти, гра запускається один раз
          Remove-Item "$fake\garrysmod\fake_launches.txt" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force build\queue | Out-Null
          & build\gmdr-cli.exe render build\td\test24.dem build\td\test20c.dem build\td\test2026.dem -o "$PWD\build\queue\" `
              --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" --size 640x360 --fps 30 --codec libx264 --menu-delay 1 --start 1 --end 3
          if ($LASTEXITCODE -ne 0) { throw "черга не вдалася" }
          if (@(Get-Content "$fake\garrysmod\fake_launches.txt").Count -ne 1) { throw "у черзі гра запускалась не один раз" }
          if (@(Get-ChildItem build\queue -Filter *.mp4).Count -ne 3) { throw "черга: не всі відео" }
          # Перегляд у грі: імітатор сам "натискає" F9/F6/F11
          $watch = & build\gmdr-cli.exe watch build\td\test24.dem --from 2 --game-dir $fake --game-exe "$PWD\build\gmdr-fakegame.exe" --menu-delay 1
          if ($LASTEXITCODE -ne 0) { throw "перегляд не вдався" }
          if (-not ($watch -match "--start-tick \d+ --end-tick \d+")) { $watch; throw "позначки з гри не дійшли" }

      - uses: actions/upload-artifact@v4
        with:
          name: gmod-demo-render-windows
          path: |
            build/gmdr.exe
            build/gmdr-cli.exe
            build/*.dll
            build/rnnoise-voice.rnnn
            build/whisper/
            third_party/ffmpeg/LICENSE.txt

  linux-gcc:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitize: ["", "address,undefined"]
    steps:
      - uses: actions/checkout@v5

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libswresample-dev libavfilter-dev libglfw3-dev libgl-dev ffmpeg python3 lua5.1

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGMDR_BUILD_TESTS=ON \
            -DGMDR_SANITIZE="${{ matrix.sanitize }}"
          cmake --build build

      - name: Tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=0
        run: |
          mkdir -p build/td
          python3 tests/tools/make_test_demo.py build/td/test24.dem build/td/truth24.json --pe-bits 24
          python3 tests/tools/make_test_demo.py build/td/test20c.dem build/td/truth20.json --pe-bits 20 --compress-userinfo
          python3 tests/tools/make_test_demo.py build/td/test2026.dem build/td/truth2026.json --pe-bits 24 --compress-userinfo --gmod2026
          ./build/gmdr-tests build/td
          ./build/gmdr-cli --lang en info build/td/test24.dem | grep -q '^Map: *gm_construct'
          ./build/gmdr-cli info build/td/test24.dem | grep -q '^Карта: *gm_construct'

      - name: Lua driver (mocked GMod menu)
        if: matrix.sanitize == ''
        run: lua5.1 tests/lua/driver_mock_test.lua src/core/game/gmdr_driver.lua

      - name: UI translation (every string has an English version)
        if: matrix.sanitize == ''
        run: python3 scripts/i18n.py check

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libclang-rt-18-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libswresample-dev libavfilter-dev ffmpeg python3

      - name: Build the fuzzer
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ -DGMDR_BUILD_GUI=OFF -DGMDR_BUILD_CLI=OFF -DGMDR_BUILD_FUZZERS=ON \
            -DGMDR_SANITIZE=address,undefined
          cmake --build build --target gmdr-fuzz-demo

      - name: Fuzzing (2 minutes)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          mkdir -p corpus
          python3 tests/tools/make_test_demo.py corpus/a.dem corpus/a.json --pe-bits 24
          python3 tests/tools/make_test_demo.py corpus/b.dem corpus/b.json --pe-bits 24 --compress-userinfo --gmod2026
          rm corpus/*.json
          ./build/gmdr-fuzz-demo -max_total_time=120 -rss_limit_mb=4096 -max_len=400000 corpus

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            oom-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-msvc, linux-gcc, fuzz]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: gmod-demo-render-windows
          path: artifact

      - name: Package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if ! grep -q "^project(GModDemoRender VERSION $ver " CMakeLists.txt; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in CMakeLists.txt"; exit 1
          fi
          dir="GModDemoRender-$ver"
          mkdir -p "$dir/licenses"
          cp artifact/build/gmdr.exe artifact/build/gmdr-cli.exe artifact/build/*.dll artifact/build/rnnoise-voice.rnnn "$dir/"
          cp -r artifact/build/whisper "$dir/whisper"
          cp LICENSE "$dir/LICENSE.txt"
          cp artifact/third_party/ffmpeg/LICENSE.txt "$dir/licenses/FFmpeg.txt"
          cp third_party/imgui/LICENSE.txt "$dir/licenses/Dear-ImGui.txt"
          cp third_party/rnnoise-models/README.md "$dir/licenses/RNNoise-model.md"
          curl -fsSL https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/LICENSE -o "$dir/licenses/whisper.cpp.txt"
          zip -r9q "$dir-win64.zip" "$dir"
          unzip -l "$dir-win64.zip"
          # Release notes: the CHANGELOG.md section of this version
          awk -v v="$ver" 'index($0, "## " v " ") == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no section for $ver"; exit 1; fi
          echo "ASSET=$dir-win64.zip" >> "$GITHUB_ENV"
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ASSET" --title "GMod Demo Render $VERSION" --notes-file notes.md --verify-tag
